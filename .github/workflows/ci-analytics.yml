name: CI — Analytics Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/analytics-service/**'
      - 'k8s/**'
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/analytics-service/**'
      - 'k8s/**'
      - 'deploy/**'
      - '.github/workflows/**'

jobs:
  call:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: 'analytics'
      context: 'services/analytics-service'
      dockerfile: 'Dockerfile'
      image_name: 'analytics-service'
      language: 'python'
      push: ${{ github.ref == 'refs/heads/main' }}
      tests_command: 'python -m pytest test_app.py -v --tb=short'
      update_k8s_manifest: ${{ true }}
      k8s_manifest_path: 'k8s/analytics-service/deployment.yaml'
      k8s_image_prefix: '576394965690.dkr.ecr.us-east-1.amazonaws.com/analytics-service'
      k8s_container_name: 'analytics-service'

    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
