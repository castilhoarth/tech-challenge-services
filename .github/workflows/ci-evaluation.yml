name: CI — Evaluation Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/evaluation-service/**'
      - 'k8s/**'
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/evaluation-service/**'
      - 'k8s/**'
      - 'deploy/**'
      - '.github/workflows/**'

jobs:
  call:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      service: 'evaluation'
      context: 'services/evaluation-service'
      dockerfile: 'Dockerfile'
      image_name: 'evaluation-service'
      language: 'go'
      push: ${{ github.ref == 'refs/heads/main' }}
      tests_command: 'go test -v -race -cover'
      update_k8s_manifest: ${{ true }}
      k8s_manifest_path: 'k8s/evaluation-service/deployment.yaml'
      k8s_image_prefix: '576394965690.dkr.ecr.us-east-1.amazonaws.com/evaluation-service'
      k8s_container_name: 'evaluation-service'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
